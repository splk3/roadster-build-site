<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="wheel-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="hub-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>
  <!-- Outer rim (wood/leather steering rim) -->
  <circle cx="32" cy="32" r="30" fill="url(#wheel-rim)" stroke="#334155" stroke-width="2"/>
  <circle cx="32" cy="32" r="22" fill="#0f172a"/>
  <!-- 3 Aluminum spokes -->
  <line x1="32" y1="24" x2="32" y2="11" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <line x1="25" y1="36" x2="13" y2="44" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <line x1="39" y1="36" x2="51" y2="44" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <!-- Center horn button / hub cap -->
  <circle cx="32" cy="32" r="8" fill="url(#hub-red)" stroke="#f1f5f9" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="3" fill="#f8fafc"/>
</svg>
