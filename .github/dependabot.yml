version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      eslint:
        patterns:
          - eslint
          - eslint-*
          - "@eslint/*"
      stylelint:
        patterns:
          - stylelint
          - stylelint-*
          - "@stylelint/*"
      playwright:
        patterns:
          - playwright
          - playwright-*
          - "@playwright/*"
          - "@axe-core/playwright"
      html:
        patterns:
          - cheerio
          - html-validate
          - sanitize-html
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - actions/*
