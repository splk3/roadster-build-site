version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      eslint:
        patterns:
          - eslint
          - "@eslint/*"
      stylelint:
        patterns:
          - stylelint
          - stylelint-*
      playwright:
        patterns:
          - "@playwright/*"
          - "@axe-core/playwright"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - actions/*
